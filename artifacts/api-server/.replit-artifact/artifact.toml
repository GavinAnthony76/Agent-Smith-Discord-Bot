kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
# Smith is plain JavaScript. Validate offline; no DDL or Discord connection.
args = ["pnpm", "--filter", "@workspace/agent-smith", "run", "preflight"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
# Repository-root command starts only the existing Smith Gateway worker.
args = ["pnpm", "--filter", "@workspace/agent-smith", "run", "start"]

[services.production.run.env]
NODE_ENV = "production"
